<html lang="en">
<head>
  <title>PDF Show Off</title>
<link rel="stylesheet" href="../css/pico.min.css"/>
<script src="../lib/pdf-lib.js"></script>
  
<script language="javascript">
  // this kicks off a full update
  async function uploadNewFile(e) {
    const file = e.files[0]
    const input = await file.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(input);
    console.log("I see file ",file," with PDF ", pdfDoc)
    window.pdf = pdfDoc
    pageNumUpdate(document.getElementById("page_nums"))
  }
  // this only produces update if PDF has been set (but if set, will kick off update)
  function pageNumUpdate(e) {
    const pageNums = e.value.split(",").map(v => parseInt(v.trim())).filter(v => v > 0).map(v => v - 1)
    console.log("I see ",e.value," <-- this? gives -->",pageNums.join(" - "))
    if (window.pdf == null)
      return
    if (pageNums.length < 4) 
      return
    buildOutput(window.pdf, pageNums)
  }
  // the update builder
  async function buildOutput(pdfDoc, pageNumList){
    const newPdf = await PDFLib.PDFDocument.create();
    const embeddedPages = await Promise.all(pageNumList.map(async function(p) {
        const origPage = pdfDoc.getPage(p);
        return await newPdf.embedPage(origPage)
      }))
    window.embedded = embeddedPages
    const baseDimen = 200
    const pageDimens = [baseDimen * 4, baseDimen * 5]
    const newPage =  newPdf.addPage(pageDimens);
    if(document.getElementById("layout_2x2").checked) {
      layout_page_2x2(
        newPage,
        embeddedPages,
        pageNumList,
        [embeddedPages[0].width * 1.0, embeddedPages[0].height * 1.0],
        pageDimens
      )
    } else if(document.getElementById("layout_1x2").checked) {
      layout_page_1x2(
        newPage,
        embeddedPages,
        pageNumList,
        [embeddedPages[0].width * 1.0, embeddedPages[0].height * 1.0],
        pageDimens
      )
    } else {
      layout_page_3x2(
        newPage,
        embeddedPages,
        pageNumList,
        [embeddedPages[0].width * 1.0, embeddedPages[0].height * 1.0],
        pageDimens
      )
    }
    const pdfBytes = await newPdf.save();
    // "now you're working with bindary data"
    const pdfBlob = new Blob([pdfBytes], { type: "application/pdf"});
    const previewFrame = document.getElementById('pdf_results_preview');
    const viewerPrefs = newPdf.catalog.getOrCreateViewerPreferences();
    viewerPrefs.setHideToolbar(true);//false);
    viewerPrefs.setHideMenubar(true);//false);
    viewerPrefs.setHideWindowUI(true);//false);
    viewerPrefs.setFitWindow(true);
    viewerPrefs.setCenterWindow(true);
    viewerPrefs.setDisplayDocTitle(false);//true);
    previewFrame.src = URL.createObjectURL(pdfBlob);
  }

  function layout_page_2x2(pdfPage, embeddedPages, pageNumList, origDimens, pageDimens) {
    const scaleFactor = Math.min((pageDimens[0] + 2)/origDimens[0], (pageDimens[1] + 2)/origDimens[1]) * 0.5;
    const scale = [scaleFactor, scaleFactor];
    console.log("looking at orig ", origDimens," vs ",pageDimens," yeilds ",scaleFactor)
    const drawn_width = origDimens[0] * scale[0]
    const drawn_height = origDimens[1] * scale[1]
    
    pdfPage.drawPage(embeddedPages[0], {x : 0,                  y: 0,                 xScale: scale[0], yScale: scale[1]})
    pdfPage.drawPage(embeddedPages[1], {x : drawn_width + 1,        y: 0,                 xScale: scale[0], yScale: scale[1]})
    pdfPage.drawPage(embeddedPages[2], {x : 0,                  y: drawn_height + 1, xScale: scale[0], yScale: scale[1]})
    pdfPage.drawPage(embeddedPages[3], {x : drawn_width + 1,        y: drawn_height + 1, xScale: scale[0], yScale: scale[1]})
    pdfPage.drawRectangle({x: 0, y: 0, width: drawn_width, height: drawn_height, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})
    pdfPage.drawRectangle({x: drawn_width , y: 0, width: drawn_width, height: drawn_height, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})
    pdfPage.drawRectangle({x: drawn_width , y: drawn_height, width: drawn_width, height: drawn_height, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})
    pdfPage.drawRectangle({x: 0 , y: drawn_height, width: drawn_width, height: drawn_height, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})

    pdfPage.drawRectangle({x: 0 , y: drawn_height * 2, width: pageDimens[0], height: pageDimens[1], color: PDFLib.rgb(0,0,0), opacity: 1})
    pdfPage.drawRectangle({x: drawn_width * 2 , y: 0, width: pageDimens[0], height: pageDimens[1], color: PDFLib.rgb(0,0,0), opacity: 1})
  }

  function layout_page_1x2(pdfPage, embeddedPages, pageNumList, origDimens, pageDimens) {
    const scaleFactor = Math.min((pageDimens[0] + 2)/origDimens[0], (pageDimens[1] + 2)/origDimens[1] *0.5);
    const scale = [scaleFactor, scaleFactor];
    console.log("looking at orig ", origDimens," vs ",pageDimens," yeilds ",scaleFactor)
    const drawn_width = origDimens[0] * scale[0]
    const drawn_height = origDimens[1] * scale[1]
    
    pdfPage.drawPage(embeddedPages[0], {x : 0,                  y: 0,                 xScale: scale[0], yScale: scale[1]})
    pdfPage.drawPage(embeddedPages[2], {x : 0,                  y: drawn_height + 1, xScale: scale[0], yScale: scale[1]})
    pdfPage.drawRectangle({x: 0, y: 0, width: drawn_width, height: drawn_height, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})
    pdfPage.drawRectangle({x: 0 , y: drawn_height, width: drawn_width, height: drawn_height, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})

    pdfPage.drawRectangle({x: 0 , y: drawn_height *2, width: pageDimens[0], height: pageDimens[1], color: PDFLib.rgb(0,0,0), opacity: 1})
    pdfPage.drawRectangle({x: drawn_width  , y: 0, width: pageDimens[0], height: pageDimens[1], color: PDFLib.rgb(0,0,0), opacity: 1})
  }

  function layout_page_3x2(pdfPage, embeddedPages, pageNumList, origDimens, pageDimens) {
    const pairScaleFactor = Math.min((pageDimens[0] + 2)/origDimens[0], (pageDimens[1] + 2)/origDimens[1]) * 0.5;
    const headRoom = pageDimens[1] - origDimens[1] * pairScaleFactor
    const drawn_width_bottom = origDimens[0] * pairScaleFactor
    const drawn_height_bottom = origDimens[1] * pairScaleFactor
    const tripleScaleFactor = Math.min(headRoom/origDimens[1], (drawn_width_bottom*2.0) / (origDimens[0] * 3.0))
    const drawn_width_triple = origDimens[0] * tripleScaleFactor
    const drawn_height_triple = origDimens[1] * tripleScaleFactor


    pdfPage.drawPage(embeddedPages[0], {x : 0,                  y: 0, xScale: pairScaleFactor, yScale: pairScaleFactor})
    pdfPage.drawPage(embeddedPages[1], {x : drawn_width_bottom, y: 0, xScale: pairScaleFactor, yScale: pairScaleFactor})

    pdfPage.drawPage(embeddedPages[2], {x : 0,                           y: drawn_height_bottom, xScale: tripleScaleFactor, yScale: tripleScaleFactor})
    pdfPage.drawPage(embeddedPages[3], {x : drawn_width_triple,          y: drawn_height_bottom, xScale: tripleScaleFactor, yScale: tripleScaleFactor})
    pdfPage.drawPage(embeddedPages[4], {x : drawn_width_triple * 2 + 1,  y: drawn_height_bottom, xScale: tripleScaleFactor, yScale: tripleScaleFactor})

    pdfPage.drawRectangle({x: 0 , y: 0, width: drawn_width_bottom, height: drawn_height_bottom, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})
    pdfPage.drawRectangle({x: drawn_width_bottom , y: 0, width: drawn_width_bottom, height: drawn_height_bottom, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})

    pdfPage.drawRectangle({x: 0 , y: drawn_height_bottom, width: drawn_width_triple, height: drawn_height_triple, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})
    pdfPage.drawRectangle({x: drawn_width_triple , y: drawn_height_bottom, width: drawn_width_triple, height: drawn_height_triple, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})
    pdfPage.drawRectangle({x: drawn_width_triple * 2 , y: drawn_height_bottom, width: drawn_width_triple, height: drawn_height_triple, borderColor: PDFLib.rgb(0,0,0), borderWidth: 1})

    pdfPage.drawRectangle({x: 0 , y: drawn_height_bottom + drawn_height_triple, width: pageDimens[0], height: pageDimens[1], color: PDFLib.rgb(0,0,0), opacity: 1})
    pdfPage.drawRectangle({x: drawn_width_bottom * 2 , y: 0, width: pageDimens[0], height: pageDimens[1], color: PDFLib.rgb(0,0,0), opacity: 1})
  }

</script>
</head>
<body>
  <div style="float:right;border: 1px solid black;margin-right: 20px;">
    <center>
    <iframe style="width:1000px; height: 800px;" id="pdf_results_preview" type="application/pdf"></iframe>
    </center>
  </div>
  <div style="width:700px;padding-left:100px;zoom:0.5;">
    <h2>Input <small>(v.0.0.4)</small></h2>
    Input PDF: <input type="file" id="file" name="file" accept=".pdf" onchange="uploadNewFile(this)">
    <br>
    Input Page Numbers: <small>(comma seperated 1-indexed page numbers)</small>
    <input type="text" id="page_nums" name="page_nums" oninput="pageNumUpdate(this)" value="1,2,3,4,5,6,7,8,10">
    <br>
    Layout Style:
    <input type="radio" id="layout_2x2" name="layout_style" value="2x2" onchange="pageNumUpdate(document.getElementById('page_nums'))" checked>
      <label for="layout_2x2">2x2</label>
    <input type="radio" id="layout_3x2" name="layout_style" value="3x2" onchange="pageNumUpdate(document.getElementById('page_nums'))">
      <label for="layout_3x2">3 & 2</label>
    <input type="radio" id="layout_1x2" name="layout_style" value="1x2" onchange="pageNumUpdate(document.getElementById('page_nums'))">
      <label for="layout_3x2">1 x 2</label>
  </div>

<div style="clear:both;"></div>

<small style="float:right;">
    PDF library by <a href="https://pdf-lib.js.org/" target="_blank">PDF-LIB</a><br>

</body>
</html>
